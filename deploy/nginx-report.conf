    # Paste this block into /etc/nginx/sites-available/counter, in the
    # "listen 443" server block, after the "location /stats/" block.

    # ── Stats report web interface (password protected) ─────────────────────
    # The gu-stats-report app (web.py), run by gunicorn on port 5001.
    # /report (no slash) is redirected to /report/ by nginx automatically.
    location /report/ {
        auth_basic           "Republication Stats";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass         http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        # So the app's redirects keep https (web.py uses ProxyFix).
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;

        # A report takes ~6 seconds; allow plenty in case Matomo is slow.
        proxy_read_timeout 120s;

        # Keep report requests out of the pixel log.
        access_log off;

        # No add_header here: it would switch off the server's security
        # headers (HSTS etc.) for this location. web.py sets Cache-Control.
    }
